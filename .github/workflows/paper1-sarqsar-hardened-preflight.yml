name: Paper 1 SARQSAR hardened preflight

on:
  push:
    branches:
      - paper1-sarqsar-metric-coupling-2026
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy matplotlib pillow rdkit

      - name: Run the same hardened preflight used on Windows
        run: python -u paper1_leakage_benchmark/scripts/42_run_paper1_sarqsar_overnight_hardened_v1.py --preflight-only

      - name: Verify repair manifest and subset-safe aggregation
        shell: python
        run: |
          import json
          from pathlib import Path

          manifest_path = Path("paper1_leakage_benchmark/scripts/_generated/34_run_metric_coupling_null_v1_materialized.json")
          generated_path = Path("paper1_leakage_benchmark/scripts/_generated/34_run_metric_coupling_null_v1_materialized.py")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          generated = generated_path.read_text(encoding="utf-8")

          assert manifest["status"] == "syntax_pass", manifest
          assert manifest["repairs"] == {
              "root_depth": 1,
              "table_header": 1,
              "table_row": 1,
              "subset_aggregation_guard": 1,
              "residual_summary": 1,
          }, manifest
          assert manifest["generated_repository_root_depth"] == 3, manifest
          assert "ROOT = Path(__file__).resolve().parents[3]" in generated
          assert "if regression.empty:" in generated
          assert '"max_abs_mse_decomposition_residual": [max_residual]' in generated
          print("REPAIR CONTRACT, SUBSET AGGREGATION, AND FUNCTIONAL PREFLIGHT: PASS")
