protocol_status: draft_pre_freeze
protocol_version: 0.1
base_commit: a1d5f71790cfc7f668fee5455b2be8f88267c5ea

outer_role_candidates:
  - {dev: 0.50, policy: 0.10, conformal: 0.20, test: 0.20}
  - {dev: 0.50, policy: 0.15, conformal: 0.15, test: 0.20}
  - {dev: 0.55, policy: 0.15, conformal: 0.15, test: 0.15}
preferred_pending_audit: {dev: 0.50, policy: 0.10, conformal: 0.20, test: 0.20}

tracks: [random_grouped, strict_scaffold, similarity_cluster]
similarity_cluster:
  algorithm: deterministic_ordered_leader_clustering
  fingerprint: {kind: Morgan, radius: 2, n_bits: 2048, chirality: false}
  similarity: Tanimoto
  join_threshold_inclusive: 0.60
  order_seed: 1701
  order_key: sha256_order_seed_and_structure_id
  max_endpoint_n: 15000
  assignment_uses_labels: false
main_split_seeds: [101, 102, 103, 104, 105]
anchor_extra_split_seeds: [106, 107, 108, 109, 110]
development_meta_folds: 3
primary_training_regime: unweighted
anchor_training_regime_sensitivity: class_weighted

fingerprint: {kind: Morgan, radius: 2, n_bits: 2048, chirality: false}
probability_clip_epsilon: 1.0e-6
calibration_primary: platt
local_loss_neighbors: 20
bri_weighting: class_balanced

attenuation:
  t_max_candidates: [1.0, 1.5, 2.0]
  selection_scope: global_development_only
gate:
  threshold_grid: [0.50, 0.60, 0.70, 0.80, 0.90, 1.00]
  minimum_planned_retention: 0.50
  selected_calibration_minimum_per_class: 35
conformal:
  alpha_primary: 0.10
  quantile: finite_sample_order_statistic
  insufficient_cell_threshold: positive_infinity

formal_freeze_blockers:
  - endpoint_eligibility
  - precision_power_audit
  - exact_software_and_model_revisions
  - leakage_tests
  - measured_compute_benchmark
  - user_approval
