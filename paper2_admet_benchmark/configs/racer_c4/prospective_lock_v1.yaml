    member_sha256: d66e1f9ec945ee528b1bea6e49af9c10d0bad546c2b304eb96004c8228824206
    role: model_fit_router_and_internal_conformal
  leaderboard_development_labels:
    url: "https://tripod.nih.gov/tox21/challenge/download?id=tox21_10k_challenge_testsdf&sec="
    filename: tox21_10k_challenge_test.sdf.zip
    sha256: 7ab05627b78db60f5a8426dc18d3bd50904ddab0e4ba1b2f33ad883f5087afd9
    member: tox21_10k_challenge_test.sdf
    member_sha256: 98ef9e89a030962ec27c5b437d6daf415234a45479dc4c86c72006f9e3b9b4db
    expected_structure_count: 296
