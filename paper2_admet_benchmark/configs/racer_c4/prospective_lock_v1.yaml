lock_status: candidate_frozen_before_final_epa_label_open
algorithm: RACER-C4/TAME
algorithm_long_name: transport_audited_multiview_conformal_envelope
algorithm_version: 4.0.0-rc1
parent_algorithm: RACER-C-v1.0
scientific_scope: NCATS_Tox21_2014_assay_family_only

data_sources:
  training_archive:
    url: "https://tripod.nih.gov/tox21/challenge/download?id=tox21_10k_data_allsdf&sec="
    filename: tox21_10k_data_allsdf.zip
    sha256: 024a3ae2690bcd4a593e6e0b10b455470b9bcb1d8f299dd36f220a250181517b
